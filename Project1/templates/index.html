<!DOCTYPE html>
<html lang="en">
<head xmlns="http://www.w3.org/1999/xhtml">
    <meta charset="UTF-8">
    <title>Car Price Predictor</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" type="text/css"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
            crossorigin="anonymous"></script>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>

</head>
<body style="background-color: #01020a;">

<div class="container">
    <div class="row">
        <div class="card mt-50" style="width: 100%; height: 100%">
            <div class="card-header" style="text-align: center">
                <h1>Welcome to Car Price Predictor</h1>
            </div>
            <div class="card-body" style="background-color: #4d314f; width: 80%; margin: auto; border-radius: 15px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); color: white;">

                <div class="col-12" style="text-align: center; background-color: #add8e6; padding: 20px; border-radius: 10px;">
                    <h5 style="font-family: 'Arial', sans-serif; color: #333; font-size: 1.5em;">
                        This website predicts the price of a car you want to sell. Try filling the details below:
                    </h5>
                </div>
                
                <br>

                <form method="post" accept-charset="utf-8" name="Modelform" style="border-radius: 15px; padding: 20px; background: #051180;">

                    <div class="col-md-10 form-group" style="text-align: center; margin: auto;">
                        <label style="font-size: 1.2rem; font-weight: bold; color: white;">
                            <b>Select the Company:</b>
                        </label><br>
                        <div style="position: relative; display: inline-block; text-align: left;">
                            <select class="selectpicker form-control" id="company" name="company" required="1" 
                                    onchange="load_car_models(this.id,'car_models')" 
                                    style="width: 100%; height: auto; padding: 10px; border-radius: 10px; background-color: #f0f0f0; 
                                           border: 2px solid #007bff; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);">
                                <option selected disabled style="color: #999;">Select a Company</option>
                                {% for company in companies %}
                                <option value="{{ company }}">{{ company }}</option>
                                {% endfor %}
                            </select>
                            <span class="custom-arrow" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                                ▼
                            </span>
                        </div>
                    </div>

                    <br>
                    

                    <div class="col-md-10 form-group" style="text-align: center; margin: auto;">
                        <label style="font-size: 1.2rem; font-weight: bold; color: white;">
                            <b>Select the Model:</b>
                        </label><br>
                        <div style="position: relative; display: inline-block; text-align: center; width: 100%;">
                            <select class="selectpicker form-control" id="car_models" name="car_models" required="1" 
                                    style="width: 100%; height: auto; padding: 10px; border-radius: 10px; background-color: #f0f0f0; 
                                           border: 2px solid #007bff; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); text-align: center;">
                                <option selected disabled style="color: #999;">Select a Model</option>
                                <!-- Model options will be dynamically populated -->
                            </select>
                            <span class="custom-arrow" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                                ▼
                            </span>
                        </div>
                    </div>

                    <br>
                    

                    <div class="col-md-10 form-group" style="text-align: center; margin: auto;">
                        <label style="font-size: 1.2rem; font-weight: bold; color: white;">
                            <b>Select Year of Purchase:</b>
                        </label><br>
                        <div style="position: relative; display: inline-block; text-align: center; width: 100%;">
                            <select class="selectpicker form-control" id="year" name="year" required="1"
                                    style="width: 100%; height: auto; padding: 10px; border-radius: 10px; background-color: #f0f0f0; 
                                           border: 2px solid #007bff; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); text-align: center;">
                                <option selected disabled style="color: #999;">Select Year</option>
                                {% for year in years %}
                                <option value="{{ year }}">{{ year }}</option>
                                {% endfor %}
                            </select>
                            <span class="custom-arrow" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                                ▼
                            </span>
                        </div>
                    </div>

                    <br>
                    

                    <div class="col-md-10 form-group" style="text-align: center; margin: auto;">
                        <label style="font-size: 1.2rem; font-weight: bold; color: white;">
                            <b>Select the Fuel Type:</b>
                        </label><br>
                        <div style="position: relative; display: inline-block; text-align: center; width: 100%;">
                            <select class="selectpicker form-control" id="fuel_type" name="fuel_type" required="1"
                                    style="width: 100%; height: auto; padding: 10px; border-radius: 10px; background-color: #f0f0f0; 
                                           border: 2px solid #007bff; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); text-align: center;">
                                <option selected disabled style="color: #999;">Select Fuel Type</option>
                                {% for fuel in fuel_types %}
                                <option value="{{ fuel }}">{{ fuel }}</option>
                                {% endfor %}
                            </select>
                            <span class="custom-arrow" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                                ▼
                            </span>
                        </div>
                    </div>

                    <br>
                    



                    <div class="col-md-10 form-group" style="text-align: center; margin: auto;">
                        <label style="font-size: 1.2rem; font-weight: bold; color: white;">
                            <b>Enter the Number of Kilometres that the car has travelled:</b>
                        </label><br>
                        <div style="position: relative; display: inline-block; text-align: center; width: 100%;">
                            <input type="text" class="form-control" id="kilo_driven" name="kilo_driven"
                                   placeholder="Enter the kilometres driven"
                                   style="width: 100%; height: auto; padding: 10px; border-radius: 10px; background-color: #f0f0f0; 
                                          border: 2px solid #007bff; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); text-align: center;">
                        </div>
                    </div>

                    <br>
                    
                    <div class="col-md-10 form-group" style="text-align: center; margin: auto;">
                        <button class="btn btn-primary form-control" onclick="send_data()"
                                style="width: 100%; height: auto; padding: 10px; font-size: 1.2rem; font-weight: bold; background-color: #051cf0; 
                                       border: none; border-radius: 10px; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); text-align: center;">
                            Predict Price
                        </button>
                    </div>
                    


                </form>


                <br>


                <div class="row">
                    <div class="col-12" style="text-align: center">
                        <h4><span id="prediction"></span></h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>

    function load_car_models(company_id,car_model_id)
    {
        var company=document.getElementById(company_id);
        var car_model= document.getElementById(car_model_id);
        console.log(company.value);
        car_model.value="";
        car_model.innerHTML="";
        {% for company in companies %}
            if( company.value == "{{ company }}")
            {
                {% for model in car_models %}
                    {% if company in model %}

                        var newOption= document.createElement("option");
                        newOption.value="{{ model }}";
                        newOption.innerHTML="{{ model }}";
                        car_model.options.add(newOption);
                    {% endif %}
                {% endfor %}
            }
        {% endfor %}
    }

    function form_handler(event) {
        event.preventDefault(); // Don't submit the form normally
    }
    function send_data()
    {
        document.querySelector('form').addEventListener("submit",form_handler);

        var fd=new FormData(document.querySelector('form'));

        var xhr= new XMLHttpRequest({mozSystem: true});

        xhr.open('POST','/predict',true);
        document.getElementById('prediction').innerHTML="Wait! Predicting Price.....";
        xhr.onreadystatechange = function(){
            if(xhr.readyState == XMLHttpRequest.DONE){
                document.getElementById('prediction').innerHTML="Prediction Amount : Tk "+xhr.responseText;

            }
        };

        xhr.onload= function(){};

        xhr.send(fd);
    }
</script>


<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>
</body>
</html>
